<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise for Achacha</title>
<style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
  
  #startScreen {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  #startBtn {
    background: #ff006e;
    color: #fff;
    border: none;
    padding: 20px 50px;
    border-radius: 50px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 0, 110, 0.4);
  }
  #startText {
    color: #333;
    font-size: 20px;
    margin-bottom: 30px;
    font-weight: 600;
  }

  #bdayScreen {
    background: #000;
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    padding: 20px;
  }
  .container {
    text-align: center;
    z-index: 10;
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 2px solid #ffd60a;
    border-radius: 20px;
    padding: 30px 25px;
    box-shadow: 0 0 40px rgba(255, 214, 10, 0.4);
    max-width: 450px;
    animation: fadeIn 1s ease-in;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid #ffd60a;
    object-fit: cover;
    margin: 0 auto 15px;
    box-shadow: 0 0 30px rgba(255, 214, 10, 0.6);
    animation: pulse 2s ease-in-out infinite;
    background: #333; /* Photo load aayillel grey kanikkum */
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  h1 {
    color: #ffd60a;
    font-size: 34px;
    text-shadow: 0 0 20px #ffd60a;
    margin-bottom: 10px;
  }
  .name {
    color: #00b4d8;
    font-size: 24px;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 0 0 10px #00b4d8;
  }
  .cake-img {
    width: 200px;
    margin: 15px 0;
    animation: bounce 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 15px #ff006e);
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-15px) rotate(3deg); }
  }
  .wish {
    color: #fff;
    font-size: 18px;
    margin: 12px 0;
    line-height: 1.6;
  }
  .crackers {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .cracker {
    position: absolute;
    font-size: 30px;
    animation: blast 3s linear infinite;
  }
  @keyframes blast {
    0% { transform: translateY(-10vh) scale(0) rotate(0deg); opacity: 1; }
    50% { transform: translateY(50vh) scale(1.5) rotate(180deg); opacity: 1; }
    100% { transform: translateY(110vh) scale(0) rotate(360deg); opacity: 0; }
  }
  .firework {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: fireworkBlast 1s ease-out forwards;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes fireworkBlast {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(30) translate(var(--x), var(--y)); opacity: 0; }
  }
</style>
</head>
<body>

<div id="startScreen">
  <p id="startText">Achacha nu oru surprise undu 🎁</p>
  <button id="startBtn" onclick="showBirthday()">Click Cheyyu 🎉</button>
</div>

<div id="bdayScreen">
  <div class="crackers" id="crackers"></div>
  
  <div class="container">
    <img src="daddy.jpg" alt="Achacha" class="photo">
    <h1>Happy Birthday Achacha</h1>
    <div class="name">SIJU GEORGE</div>
    
    <!-- PUTHIYA WORKING CAKE IMAGE -->
    <img src="https://png.pngtree.com/png-vector/20230304/ourmid/pngtree-birthday-cake-png-image_6627878.png" alt="Cake" class="cake-img">
    
    <p class="wish">Ente ponnu achacha nu ❤️</p>
    <p class="wish">Ini ulla ella divasavum santhosham mathram 🙏</p>
    <p class="wish">Love you Achacha 💙</p>
  </div>
</div>

<audio id="boomSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_2b2e1b8d77.mp3" type="audio/mpeg">
</audio>

<script>
function showBirthday() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('bdayScreen').style.display = 'flex';
  document.getElementById('boomSound').play();
  createBigFirework();
  startCrackers();
}

function createBigFirework() {
  const colors = ['#ff006e', '#ffd60a', '#00b4d8', '#06ffa5', '#ff9e00'];
  for(let i = 0; i < 80; i++) {
    const firework = document.createElement('div');
    firework.classList.add('firework');
    firework.style.left = '50%';
    firework.style.top = '50%';
    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
    firework.style.setProperty('--x', (Math.random() - 0.5) * 400 + 'px');
    firework.style.setProperty('--y', (Math.random() - 0.5) * 400 + 'px');
    firework.style.animationDelay = Math.random() * 0.3 + 's';
    document.body.appendChild(firework);
    setTimeout(() => firework.remove(), 1000);
  }
}

function createCracker() {
  const crackers = ['🎆','🚀','✨','🎇','💥','🌟','🎉'];
  const cracker = document.createElement('div');
  cracker.classList.add('cracker');
  cracker.innerHTML = crackers[Math.floor(Math.random() * crackers.length)];
  cracker.style.left = Math.random() * 100 + 'vw';
  cracker.style.animationDuration = Math.random() * 2 + 2 + 's';
  document.getElementById('crackers').appendChild(cracker);
  setTimeout(() => cracker.remove(), 4000);
}

function startCrackers() {
  setInterval(createCracker, 150);
  for(let i=0; i<50; i++) {
    setTimeout(createCracker, i * 50);
  }
}
</script>
</body>
</html>
